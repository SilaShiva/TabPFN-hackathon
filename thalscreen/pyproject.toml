[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thalscreen"
version = "0.1.0"
description = "CBC-only beta-thalassaemia carrier screening benchmark: TabPFN-3.5 vs the published clinical indices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sila Shivanandan" }]
keywords = [
    "tabpfn",
    "thalassemia",
    "screening",
    "clinical-decision-support",
    "tabular",
    "foundation-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tabpfn-client>=0.5.3",
]

[project.optional-dependencies]
local = ["tabpfn>=9.0.0"]
dev = ["pytest>=8", "tabulate"]

[project.urls]
Homepage = "https://github.com/SilaShiva/TabPFN-hackathon"

[tool.setuptools.packages.find]
where = ["src"]
